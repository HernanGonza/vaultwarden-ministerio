services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./vw-data:/data
      # Tema del Ministerio (ver branding/README.md). Se montan carpetas/archivos de solo lectura:
      - ./branding/scss:/data/templates/scss:ro                  # CSS de usuario (user.vaultwarden.scss.hbs)
      - ./branding/fonts:/web-vault/fonts/ministerio:ro          # tipografía Oak Sans
      - ./branding/images:/web-vault/images/ministerio:ro        # flor del lapacho (logo)
      - ./branding/locales/es/messages.json:/web-vault/locales/es/messages.json:ro   # textos en español ("gestor de claves")
      - ./branding/favicon/favicon.ico:/web-vault/favicon.ico:ro
      - ./branding/favicon/favicon-16x16.png:/web-vault/images/favicon-16x16.png:ro
      - ./branding/favicon/favicon-32x32.png:/web-vault/images/favicon-32x32.png:ro
      - ./branding/favicon/apple-touch-icon.png:/web-vault/images/apple-touch-icon.png:ro
      - ./branding/favicon/android-chrome-192x192.png:/web-vault/images/android-chrome-192x192.png:ro
      - ./branding/favicon/android-chrome-512x512.png:/web-vault/images/android-chrome-512x512.png:ro
      - ./branding/favicon/safari-pinned-tab.svg:/web-vault/images/safari-pinned-tab.svg:ro

  caddy:
    image: caddy:2-alpine
    container_name: vaultwarden-caddy
    restart: unless-stopped
    depends_on:
      - vaultwarden
    ports:
      - "4444:4444"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
